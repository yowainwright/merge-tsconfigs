name: Test Published Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published merge-tsconfigs version to test (leave empty for latest on npm)'
        required: false
        type: string

permissions:
  contents: read

env:
  SOCKET_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY || secrets.SOCKET_TOKEN }}
  SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY || secrets.SOCKET_TOKEN }}

jobs:
  test-published-release:
    runs-on: ubuntu-latest
    name: ${{ matrix.package-manager }} smoke
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm, bun]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      - name: Setup Bun
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Enable pnpm
        run: corepack enable

      - name: Install workflow dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine version to test
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(npm view merge-tsconfigs version)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Testing merge-tsconfigs@$VERSION"

      - name: Wait for npm package availability
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for merge-tsconfigs@$VERSION to be available on npm..."
          for attempt in {1..30}; do
            if npm view "merge-tsconfigs@$VERSION" version >/dev/null 2>&1; then
              echo "merge-tsconfigs@$VERSION is available on npm"
              exit 0
            fi
            echo "Attempt $attempt/30: package not available yet, waiting 30 seconds..."
            sleep 30
          done
          echo "merge-tsconfigs@$VERSION was not available on npm in time"
          exit 1

      - name: Smoke test published package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node --import tsx scripts/smoke-package.ts "merge-tsconfigs@$VERSION" --manager "${{ matrix.package-manager }}"

      - name: Report test result
        run: |
          echo "Tested merge-tsconfigs@${{ steps.version.outputs.version }}"
          echo "Package manager: ${{ matrix.package-manager }}"
          echo "Library import and CLI smoke tests passed"
