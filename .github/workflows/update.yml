name: update deps

on:
  schedule:
    - cron: '0 5 * * 2'

jobs:
  update-deps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false

      - name: Install Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run update
      - run: pnpm install --no-frozen-lockfile
      - name: Verify dependency update policy
        run: pnpm run deps:check
      - run: pnpm typecheck
      - run: pnpm typecheck:tsgo
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - name: Create Pull Request
        # peter-evans/create-pull-request@v6
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          token: ${{ secrets.PR_CREATE_TOKEN }}
          commit-message: 'chore: update dependencies [codependence]'
          title: 'chore: update dependencies [Codependence]'
          body: |
            ## Dependency updates
            Auto-generated by [codependence][1] using [create-pull-request][2]
            [1]: https://github.com/yowainwright/merge-tsconfigs
            [2]: https://github.com/peter-evans/create-pull-request
          branch: update-dependencies
          labels: codependencies
